name: Bug report
description: Report a reproducible problem in VDOS
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please report one issue per form. Do not include passwords, tokens, or personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Python assembler or VM
        - BIOS bootloader
        - Keyboard shell
        - Command shell
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the error text if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Enter ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Tool versions
      description: Python, NASM, and/or QEMU versions, as applicable
    validations:
      required: false
