name: Feature request
description: Suggest a focused improvement to VDOS
title: "Feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Start with one small, testable improvement. For large changes, discuss the design before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How to verify it
      description: What behavior or test would show this is done?
    validations:
      required: true
